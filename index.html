<html lang="en">
<head>

<meta property="og:description" content="Every movie streaming at Cambokino, refreshed weekly">

<meta property="og:image" content="https://barburevencu.github.io/streaming-movies/og.png">

<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,800,100,1&family=Shrikhand&display=swap">
<style>
  /* Funk: a 70s video-store wall. Cream and brown by day, chocolate after sunset in Paris. */
  :root { --maxw:1120px; --mono:"DM Mono",ui-monospace,monospace; --display:"Shrikhand",cursive; --title:"Fraunces",Georgia,serif; }
  body[data-skin="funk"] {
    --bg:#f6ead2; --card:#fff8ea; --fg:#3b1f12; --muted:#8a6a52; --faint:#c9b597; --line:#3b1f12;
    --o:#e5532d; --y:#f2a93b; --t:#1f8a84; --p:#c23b6b; --accent-text:#c23b6b; --shadow:#e5532d; color-scheme:light;
  }
  body[data-skin="funknight"] {
    --bg:#22130c; --card:#2f1b11; --fg:#f6ead2; --muted:#b39478; --faint:#6b4e3a; --line:#f6ead2;
    --o:#ff6a3d; --y:#ffb648; --t:#3ec1b8; --p:#ff5c93; --accent-text:#ffb648; --shadow:#ff6a3d; color-scheme:dark;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--mono); }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  a { color:inherit; }

  /* Header with the four-stripe band underneath. */
  header { position:sticky; top:0; z-index:10; background:var(--bg); }
  header::after { content:""; display:block; height:18px;
    background:linear-gradient(var(--fg) 0 25%, var(--o) 25% 50%, var(--y) 50% 75%, var(--t) 75%); }
  .bar { display:flex; align-items:center; gap:20px; padding:14px 0 12px; }
  .logo { display:flex; align-items:center; gap:10px; font-family:var(--display); font-size:30px; line-height:1; text-decoration:none; color:var(--o);
          text-shadow:2px 2px 0 var(--fg), 4px 4px 0 var(--y); letter-spacing:.01em; transform:rotate(-2deg); }
  .logo .mark { width:38px; height:38px; flex:0 0 auto; filter:drop-shadow(2px 2px 0 var(--y)); }
  nav { margin-left:auto; display:flex; gap:6px; }
  .tab { cursor:pointer; color:var(--fg); padding:6px 14px; border:2px solid transparent; border-radius:999px;
         background:none; font:500 12px var(--mono); text-transform:uppercase; letter-spacing:.08em; }
  .tab:hover { border-color:var(--fg); }
  .tab.active { background:var(--fg); color:var(--bg); }
  .srch { display:flex; align-items:center; }
  .sicon { display:flex; cursor:pointer; background:none; border:0; padding:4px; color:var(--fg); }
  .sicon svg { width:18px; height:18px; }
  .srch.open .sicon, .srch:not(.open) .search { display:none; }
  .search { width:180px; font:13px var(--mono); color:var(--fg); background:var(--card);
            border:2px solid var(--fg); border-radius:999px; padding:6px 14px; }
  .search:focus { outline:none; box-shadow:3px 3px 0 var(--o); }

  .controls { display:flex; flex-direction:column; gap:10px; padding:22px 0 4px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { cursor:pointer; border:2px solid var(--fg); border-radius:999px; padding:5px 13px; font:500 12px var(--mono);
          background:var(--card); color:var(--fg); transition:transform .1s; }
  .pill:hover { transform:translateY(-1px); box-shadow:2px 2px 0 var(--fg); }
  .pill.off { color:var(--muted); border-color:var(--faint); background:transparent; }
  .pill.all { font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .pill.all.on { background:var(--o); color:#fff8ea; }
  .pill[data-tspdt].on { background:var(--y); color:#3b1f12; }
  .pill[data-watched].on { background:var(--t); color:#fff8ea; }
  .sels { margin-left:auto; }
  body:has(#mindex.on) .controls { padding-right:var(--idxw,0px); }
  .sel { font:500 12px var(--mono); border:2px solid var(--fg); border-radius:999px; padding:5px 10px; background:var(--card); color:var(--fg); cursor:pointer; }

  /* The wall: posters as tape boxes on a shelf. */
  main { padding:16px 0 40px; }
  #view { display:grid; grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); gap:30px 22px; align-items:start; }
  #view > .chead, #view > .dday, #view > .empty, #view > .note, #view > .more, #view > .gone { grid-column:1 / -1; }
  .film { display:flex; flex-direction:column; position:relative; }
  .film:nth-child(4n+1) { --shadow:var(--o); } .film:nth-child(4n+2) { --shadow:var(--y); }
  .film:nth-child(4n+3) { --shadow:var(--t); } .film:nth-child(4n) { --shadow:var(--p); }
  .poster { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; border:3px solid var(--fg); border-radius:12px;
            background:repeating-linear-gradient(45deg, var(--y) 0 10px, var(--o) 10px 20px);
            box-shadow:6px 6px 0 var(--shadow); transition:transform .15s ease, box-shadow .15s ease; }
  .film:hover .poster { transform:rotate(-2deg) translate(-2px,-3px); box-shadow:9px 9px 0 var(--shadow); }
  .film:nth-child(even):hover .poster { transform:rotate(2deg) translate(-2px,-3px); }
  .info { padding:12px 2px 0; min-width:0; }
  .ti { font:800 16px/1.15 var(--title); font-variation-settings:"SOFT" 100, "WONK" 1; letter-spacing:-.01em;
        overflow-wrap:break-word; }  /* a safety net under breakable() */
  .ti a { text-decoration:none; }
  .ti a:hover { color:var(--accent-text); }
  .by { color:var(--muted); font-size:11.5px; line-height:1.5; margin-top:3px; }
  .morig { font-style:italic; }
  /* Short credits on a small card: no original title; runtime and genres below, as on Paris Cinemas (not on phones). */
  .by > .ph-hide:has(.morig) { display:none; }
  .mdet { margin-top:1px; }
  /* TSPDT rank: a round price sticker on the box. */
  .tspdt { position:absolute; top:-10px; right:-8px; z-index:2; display:grid; place-items:center; width:44px; height:44px;
           border-radius:50%; background:var(--y); color:#3b1f12; border:2px solid var(--fg); font:700 12px var(--mono);
           transform:rotate(12deg); }
  .newtag { position:absolute; top:10px; left:-6px; z-index:2; background:var(--t); color:#fff8ea; padding:2px 8px;
            font:700 10.5px var(--mono); text-transform:uppercase; letter-spacing:.08em; border:2px solid var(--fg); transform:rotate(-6deg); }
  /* Platforms: little stickers. */
  .where { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .where a { text-decoration:none; font:500 10.5px var(--mono); padding:2px 8px; border-radius:999px;
             border:1.5px solid var(--fg); background:var(--card); white-space:nowrap; }
  .where a:nth-child(3n+1) { background:var(--o); color:#fff8ea; }
  .where a:nth-child(3n+2) { background:var(--t); color:#fff8ea; }
  .where a:nth-child(3n) { background:var(--y); color:#3b1f12; }
  .where a:hover { transform:rotate(-3deg); }
  .where .rg { opacity:.8; }

  .chead, .dday { display:flex; align-items:baseline; gap:12px; padding:18px 0 0; }
  .cname, .dday { font:400 28px/1 var(--display); color:var(--o); text-shadow:2px 2px 0 var(--fg); }
  .dday { font-size:22px; }
  .caddr { color:var(--muted); font-size:12px; }
  .gone { display:flex; gap:12px; font-size:12px; color:var(--muted); padding:8px 0; border-bottom:2px dashed var(--faint); }
  .gone b { color:var(--fg); font-weight:500; flex:1; }
  .empty, .note { color:var(--muted); font-size:13px; padding:20px 0; }
  .note { padding:64px 0; text-align:center; }
  .more { height:1px; }

  footer { margin-top:12px; }
  footer::before { content:""; display:block; height:10px;
    background:linear-gradient(var(--t) 0 33%, var(--y) 33% 66%, var(--o) 66%); }
  .status { color:var(--muted); font-size:12px; padding:16px 0 64px; }

  #lightbox { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(34,19,12,.85); padding:24px; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:92vw; max-height:88vh; border-radius:14px; border:4px solid #f6ead2; box-shadow:10px 10px 0 #e5532d; }

  #mindex { position:fixed; right:2px; top:50%; transform:translateY(-50%); z-index:20; display:none; flex-direction:column;
            align-items:center; padding:8px 3px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer;
            background:var(--card); border:2px solid var(--fg); border-radius:999px; }
  #mindex.on { display:flex; }
  @media (pointer:fine) { #mindex { right:12px; } }
  #mindex span { display:block; padding:0 4px; font:700 var(--ifs,10.5px)/1.65 var(--mono); color:var(--o); }
  #mindex span.no { color:var(--faint); }
  #mindex.dec span { line-height:2.3; }
  .film, .chead { scroll-margin-top:var(--hdr,80px); }
  .wrap.has-idx { padding-right:max(24px, calc(var(--idxw,0px) - max(0px, (100vw - var(--maxw)) / 2))); }

  @media (max-width:560px) {
    .bar { flex-wrap:wrap; gap:10px; }
    .logo { font-size:24px; }
    .logo .mark { width:30px; height:30px; }
    nav { margin-left:0; order:2; width:100%; }
    .srch { order:1; margin-left:auto; }
    .srch.open { flex:1 1 0; min-width:0; }
    .srch.open .search { width:100%; }
    #view { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:26px 18px; }
    .by .ph-hide, .mdet { display:none; }
  }
</style>
</head>
<body data-skin="funk">
<header><div class="wrap">
  <div class="bar">
    <a class="logo" href="./"><img class="mark" src="favicon.svg" alt="">Cambokino Movies</a>
    <nav id="tabs">
      <button class="tab active" data-view="movie">Movies</button>
      <button class="tab" data-view="platform">Platforms</button>
      <button class="tab" data-view="new">New</button>
    </nav>
    <div class="srch" id="srch">
      <button class="sicon" id="sicon" type="button" aria-label="Search" title="Search (/)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="6.75" cy="6.75" r="4.75"/><path d="M10.25 10.25 14.5 14.5"/></svg></button>
      <input id="search" class="search" type="search" placeholder="search" aria-label="Search films, directors, countries, genres"
        autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
  </div>
</div></header>

<div class="wrap"><div class="controls" id="controls"></div></div>
<main><div class="wrap" id="view"><div class="note">Loading…</div></div></main>
<footer><div class="wrap"><div class="status" id="status"></div></div></footer>
<div id="lightbox" aria-hidden="true"><img alt=""></div>
<div id="mindex" role="navigation" aria-label="Jump to"></div>

<script>
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const REGION_NAMES = {RO:"Romania", US:"USA", GB:"UK", IT:"Italy", DE:"Germany", FR:"France"};
const NOW_YEAR = new Date().getFullYear();
const YEAR_BUCKETS = [
  { k:"new",    label:"New releases", test:y => y >= NOW_YEAR - 1 },
  { k:"recent", label:"21st century", test:y => y >= 2000 && y <= NOW_YEAR - 2 },
  { k:"old",    label:"20th century", test:y => y < 2000 },
];
const SORT_OPTS = [["top","Top rated"], ["title","A–Z"], ["old","Oldest first"], ["new","Newest first"], ["tspdt","TSPDT rank"]];
const CHUNK = 250;  // rows added per scroll step: the full list runs to thousands

let data = null, tspdt = new Map(), tspdtEdition = "", watched = new Set();
const initialState = () => ({ view:"movie", platforms:new Set(), regions:new Set(), platformsOpen:false,
  yearBuckets:new Set(YEAR_BUCKETS.map(b => b.k)), yearOpen:false, tspdtOnly:false, hideWatched:false, sort:"top", query:"" });
const state = initialState();
const allPlatforms = () => data.platforms.map(s => s.name);
const allRegions = () => [...new Set(data.platforms.flatMap(s => s.regions))];
// A platform we only check in one country (Criterion, Kanopy…) needs no country label.
const oneRegion = s => data.platforms.find(p => p.name === s)?.regions.length === 1;
function resetFilters(){ state.platforms = new Set(allPlatforms()); state.regions = new Set(allRegions()); }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ const [y,m,d] = iso.slice(0,10).split("-").map(Number); return WD[new Date(y,m-1,d).getDay()] + ", " + MO[m-1] + " " + d; }
const foldTitle = s => (s || "").normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
const foldText = s => String(s == null ? "" : s).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();

// Where a film streams, narrowed to the selected platforms and countries.
function whereOf(f){
  const out = [];
  for(const [s, rs] of Object.entries(f.where)){
    if(!state.platforms.has(s)) continue;
    const r = rs.filter(x => state.regions.has(x));
    if(r.length) out.push([s, r]);
  }
  return out;
}
function yearIn(y){
  if(state.yearBuckets.size === YEAR_BUCKETS.length) return true;
  const n = parseInt(y, 10);
  return isNaN(n) || YEAR_BUCKETS.some(b => state.yearBuckets.has(b.k) && b.test(n));
}
const rank = f => tspdt.get(f.id);
// Top rated: the TMDB rating pulled toward the catalog average as if by 500 more votes, so a film
// needs both a good rating and many raters to rise (Tokyo Story above Deadpool, obscure 10/10s sink).
let meanRating = 6.5;
const score = f => (f.votes * f.rating + 500 * meanRating) / (f.votes + 500);

// Search: every word must match title, original title, director, year,
// country, genres or a platform. A four-digit word is an exact year; "60s" or
// "1960s" a decade.
let _qWords = [];
const _hay = new WeakMap();
function haystack(f){
  let h = _hay.get(f);
  if(h === undefined){
    const y = parseInt(f.year, 10);
    h = " " + foldText([f.title, f.orig, f.director, f.country, f.genres, Object.keys(f.where).join(" "),
      isNaN(y) ? "" : `${Math.floor(y/10)*10}s ${String(Math.floor(y/10)*10).slice(2)}s`].join(" ")) + " ";
    _hay.set(f, h);
  }
  return h;
}
function inSearch(f){
  if(!_qWords.length) return true;
  const h = haystack(f);
  return _qWords.every(w => /^\d{4}$/.test(w) ? f.year === w : h.includes(w));
}
function visible(){
  return data.films.filter(f => whereOf(f).length && yearIn(f.year) && (!state.tspdtOnly || rank(f)) && !(state.hideWatched && watched.has(f.id)) && inSearch(f));
}

// Film row: like a Paris Cinemas film, with the platforms where its showtimes would be.
function origTitle(f){ return f.orig && f.lang !== "en" && foldTitle(f.orig) !== foldTitle(f.title) ? f.orig : ""; }
function metaLine(f){
  const orig = origTitle(f);
  const parts = [[f.director, ""], [f.year, ""], [f.country, "ph-hide"]].filter(([v]) => v);
  const rest = parts.map(([v, cls], i) => `<span${cls ? ` class="${cls}"` : ""}>${i ? " · " : ""}${esc(v)}</span>`).join("");
  return (orig ? `<span class="ph-hide"><span class="morig">${esc(orig)}</span>${rest ? " · " : ""}</span>` : "") + rest;
}
function detailLine(f){
  const g = (f.genres || "").split(", ")[0];
  return [f.runtime ? f.runtime + " min" : "", g].filter(Boolean).join(" · ");
}
function badge(f){
  const r = state.tspdtOnly || state.sort === "tspdt" ? rank(f) : undefined;
  if(!r) return "";
  const t = `#${r} in TSPDT's 1,000 Greatest Films${tspdtEdition ? ", " + tspdtEdition : ""}`;
  return `<span class="tspdt" title="${esc(t)}">#${r}</span>`;
}
function posterImg(f){
  if(!f.poster) return `<span class="poster"></span>`;
  return `<img class="poster" src="${esc(f.poster.replace("/w185/", "/w342/"))}" alt="" loading="lazy" decoding="async">`;
}
// Soft hyphens every few letters in very long words, so a title like Symbiopsychotaxiplasm
// wraps with a hyphen at the last spot that fits rather than overflowing the card.
const breakable = t => t.replace(/\p{L}{14,}/gu, w => [...w].map((c, i) => i >= 4 && i <= w.length - 4 && i % 3 === 0 ? "\u00AD" + c : c).join(""));
function filmRow(f, opts = {}){
  const w = whereOf(f).filter(([s]) => !opts.only || s === opts.only);
  const tag = opts.newTag && f.added && f.added >= weekAgo() ? `<span class="newtag">new</span>` : "";
  return `<div class="film"${opts.ig ? ` data-ig="${esc(opts.ig)}"` : ""}>${posterImg(f)}<div class="info">
    <div class="ti"><a href="${esc(f.lb)}" target="_blank" rel="noopener">${esc(breakable(f.title))}</a>${badge(f)}${tag}</div>
    <div class="by">${metaLine(f)}</div>
    ${detailLine(f) ? `<div class="by mdet">${esc(detailLine(f))}</div>` : ""}</div>
    <div class="where">${w.filter(([s]) => !(opts.only && oneRegion(s))).map(([s, rs]) =>
      `<a href="https://www.themoviedb.org/movie/${f.id}/watch?locale=${rs[0]}" target="_blank" rel="noopener" title="${esc(rs.map(r => REGION_NAMES[r] || r).join(", "))}">` +
      [opts.only ? "" : esc(s), oneRegion(s) ? "" : `<span class="rg">${rs.join(" ")}</span>`].filter(Boolean).join(" ") + `</a>`).join("")}</div></div>`;
}
function weekAgo(){ const d = new Date(Date.now() - 7*864e5); return d.toISOString().slice(0,10); }

// --- Views. Each returns a list of HTML pieces, drawn a chunk at a time. ---
let _movieIndex = [];
function movieView(){
  const yr = f => parseInt(f.year, 10);
  const byTitle = (a, b) => foldTitle(a.title).localeCompare(foldTitle(b.title)) || a.title.localeCompare(b.title);
  const list = visible();
  if(state.sort === "top") list.sort((a, b) => score(b) - score(a) || byTitle(a, b));
  else if(state.sort === "title") list.sort(byTitle);
  else if(state.sort === "tspdt") list.sort((a, b) => ((rank(a) ?? 1e9) - (rank(b) ?? 1e9)) || byTitle(a, b));
  else { const dir = state.sort === "new" ? -1 : 1; list.sort((a, b) => (isNaN(yr(a)) - isNaN(yr(b))) || dir * (yr(a) - yr(b)) || byTitle(a, b)); }
  const groupOf = f => {
    if(state.sort === "title"){ const ch = foldTitle(f.title).charAt(0).toUpperCase(); return /[A-Z]/.test(ch) ? ch : "#"; }
    if(state.sort === "tspdt") return rank(f) ? String(Math.floor(rank(f) / 100) * 100 || 1) : "?";
    if(state.sort === "top") return "";
    return isNaN(yr(f)) ? "?" : String(Math.floor(yr(f) / 10) * 10);
  };
  const seen = new Set();
  const rows = list.map(f => { const g = groupOf(f), first = g && !seen.has(g); seen.add(g); return filmRow(f, {ig: first ? g : "", newTag:true}); });
  let keys = [];
  if(state.sort === "title") keys = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  else if(state.sort === "tspdt") keys = ["1","100","200","300","400","500","600","700","800","900"];
  else if(state.sort !== "top"){
    const ds = [...seen].filter(g => g && g !== "?").map(Number);
    if(ds.length) for(let d = Math.min(...ds); d <= Math.max(...ds); d += 10) keys.push(String(d));
    if(state.sort === "new") keys.reverse();
  }
  if(seen.has("?")) keys.push("?");
  _movieIndex = keys.map(k => ({k, has:seen.has(k)}));
  return rows;
}
function platformView(){
  const list = visible().sort((a, b) => b.pop - a.pop);
  const out = [];
  for(const s of data.platforms){
    if(!state.platforms.has(s.name)) continue;
    const films = list.filter(f => whereOf(f).some(([x]) => x === s.name));
    const regions = s.regions.filter(r => state.regions.has(r));
    if(!films.length && (_qWords.length || !regions.length)) continue;
    out.push(`<div class="chead"><span class="cname">${esc(s.name)}</span><span class="caddr">${films.length.toLocaleString()} films${oneRegion(s.name) ? "" : " · " + regions.join(" ")}</span></div>`);
    if(!films.length) out.push(`<div class="empty">Nothing here.</div>`);
    for(const f of films) out.push(filmRow(f, {only:s.name, newTag:true}));
  }
  return out;
}
function newView(){
  const byDate = new Map();
  for(const f of visible()) if(f.added){ if(!byDate.has(f.added)) byDate.set(f.added, []); byDate.get(f.added).push(f); }
  const out = [];
  for(const d of [...byDate.keys()].sort().reverse()){
    out.push(`<div class="dday">Added ${fmtDate(d)}</div>`);
    for(const f of byDate.get(d).sort((a, b) => b.pop - a.pop)) out.push(filmRow(f));
  }
  if(!out.length) out.push(`<div class="empty">Nothing new yet: tracking started ${fmtDate(data.generated_at)}, so arrivals show up from the next refresh.</div>`);
  const gone = data.gone.filter(g => state.platforms.has(g.platform) && state.regions.has(g.region))
    .sort((a, b) => b.last.localeCompare(a.last));
  if(gone.length){
    out.push(`<div class="dday">Left in the past month</div>`);
    for(const g of gone) out.push(`<div class="gone"><b>${esc(g.title)}</b><span>${esc(g.year)}</span><span>${esc(g.platform)}${oneRegion(g.platform) ? "" : " " + esc(g.region)}</span></div>`);
  }
  return out;
}

// --- Drawing: the first chunk at once, more as the end scrolls into view. ---
let _rows = [], _shown = 0, _sig = "";
const viewEl = document.getElementById("view");
const moreObs = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) drawMore(); }, {rootMargin:"1200px"});
function drawMore(upTo){
  const end = Math.min(_rows.length, Math.max(_shown + CHUNK, upTo || 0));
  if(end <= _shown) return;
  const old = viewEl.querySelector(".more"); if(old) old.remove();
  viewEl.insertAdjacentHTML("beforeend", _rows.slice(_shown, end).join("") + (end < _rows.length ? `<div class="more"></div>` : ""));
  _shown = end;
  const m = viewEl.querySelector(".more"); if(m) moreObs.observe(m);
}
function renderView(){
  const rows = state.view === "platform" ? platformView() : state.view === "new" ? newView() : movieView();
  const sig = rows.length + ":" + rows.slice(0, 40).join("").length + ":" + state.view + state.sort + [...state.platforms] + [...state.regions];
  if(sig === _sig && rows.join("") === _rows.join("")) return;
  _sig = sig; _rows = rows; _shown = 0;
  viewEl.innerHTML = rows.length ? "" : `<div class="empty">${_qWords.length ? `Nothing matches “${esc(state.query.trim())}”.` : "Nothing to show."}</div>`;
  drawMore();
}

function renderIndex(){
  const ix = document.getElementById("mindex");
  const on = state.view === "movie" && _movieIndex.some(x => x.has);
  ix.classList.toggle("on", on);
  viewEl.classList.toggle("has-idx", on);
  if(!on){ ix.innerHTML = ""; ix.dataset.sig = ""; return; }
  const sig = state.sort + ":" + _movieIndex.map(x => x.k + (x.has ? "+" : "")).join(",");
  if(ix.dataset.sig === sig) return;
  ix.dataset.sig = sig;
  const dec = state.sort !== "title";
  ix.classList.toggle("dec", dec);
  ix.style.setProperty("--ifs", Math.min(10.5, (innerHeight - 170) / _movieIndex.length / (dec ? 2.3 : 1.65)) + "px");
  ix.innerHTML = _movieIndex.map(x => `<span data-k="${esc(x.k)}"${x.has ? "" : ` class="no"`}>${esc(x.k)}</span>`).join("");
  document.documentElement.style.setProperty("--idxw", Math.ceil(document.documentElement.clientWidth - ix.getBoundingClientRect().left + 8) + "px");
}
(() => {
  const ix = document.getElementById("mindex");
  let active = false, last = null;
  const jump = y => {
    const spans = [...ix.querySelectorAll("span")];
    if(!spans.length) return;
    let i = spans.findIndex(sp => y < sp.getBoundingClientRect().bottom);
    if(i < 0) i = spans.length - 1;
    let j = i;
    while(j < _movieIndex.length && !_movieIndex[j].has) j++;
    if(j >= _movieIndex.length){ j = i; while(j >= 0 && !_movieIndex[j].has) j--; }
    if(j < 0 || _movieIndex[j].k === last) return;
    last = _movieIndex[j].k;
    // Draw down to that group (and a screenful past it) before jumping.
    const at = _rows.findIndex(r => r.includes(` data-ig="${esc(last)}"`));
    if(at >= _shown) drawMore(at + 40);
    const el = viewEl.querySelector(`.film[data-ig="${CSS.escape(last)}"]`);
    if(!el) return;
    document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
    el.scrollIntoView({block:"start"});
  };
  ix.addEventListener("pointerdown", e => { active = true; try { ix.setPointerCapture(e.pointerId); } catch(_){} jump(e.clientY); e.preventDefault(); });
  ix.addEventListener("pointermove", e => { if(active) jump(e.clientY); });
  ix.addEventListener("pointerup", () => { active = false; last = null; });
  ix.addEventListener("pointercancel", () => { active = false; last = null; });
  addEventListener("resize", () => { ix.dataset.sig = ""; if(data) renderIndex(); });
})();

// --- Controls, as on Paris Cinemas: Platforms is a collapsible pill like Cinemas, then Year, TSPDT and Unseen.
// Collapsed, they share one row; Year drops to its own row once Platforms opens, and TSPDT and Unseen once Year opens.
// Clicking one item while all are on isolates it; clicking the lone item again flips to all the others.
function toggleIn(set, all, k){
  if(set.size === all.length) return new Set([k]);
  if(set.size === 1 && set.has(k)) return new Set(all.filter(x => x !== k));
  const s = new Set(set); s.has(k) ? s.delete(k) : s.add(k);
  return s.size ? s : new Set(all);
}
function renderControls(){
  const svc = allPlatforms();
  const allYears = state.yearBuckets.size === YEAR_BUCKETS.length;
  const p = (cls, attrs, label, title) => `<button class="pill ${cls}" ${attrs}${title ? ` title="${esc(title)}"` : ""}>${esc(label)}</button>`;
  const svcBtn = p("all" + (state.platforms.size === svc.length ? " on" : ""), `data-svcall="1"`, "Platforms") +
    (state.platformsOpen ? svc.map(s => p(state.platforms.has(s) ? "" : "off", `data-s="${esc(s)}"`, s)).join("") : "");
  const tspdtPill = (tspdt.size ? p("all" + (state.tspdtOnly ? " on" : ""), `data-tspdt="1"`, "TSPDT", "Only films in TSPDT's 1,000 Greatest Films, with their rank") : "") +
    (watched.size ? p("all" + (state.hideWatched ? " on" : ""), `data-watched="1"`, "Unseen") : "");
  const yearBtn = p("all" + (allYears ? " on" : ""), `data-yall="1"`, "Year") +
    (state.yearOpen ? YEAR_BUCKETS.map(b => p(state.yearBuckets.has(b.k) ? "" : "off", `data-y="${b.k}"`, b.label)).join("") : tspdtPill);
  const rows = state.platformsOpen ? [svcBtn, yearBtn] : [svcBtn + yearBtn];
  if(state.yearOpen && tspdtPill) rows.push(tspdtPill);
  const sortSel = state.view === "movie" ? `<select id="sort" class="sel" aria-label="Sort movies">` +
    SORT_OPTS.filter(([v]) => v !== "tspdt" || tspdt.size).map(([v, l]) => `<option value="${v}">${l}</option>`).join("") + `</select>` : "";
  rows[rows.length - 1] += `<div class="sels">${sortSel}</div>`;
  const c = document.getElementById("controls");
  c.innerHTML = rows.map(r => `<div class="pills">${r}</div>`).join("");
  const sel = c.querySelector("#sort");
  if(sel){ sel.value = state.sort; sel.onchange = () => { state.sort = sel.value; renderAll(); scrollTo(0, 0); }; }
  c.onclick = e => {
    const b = e.target.closest(".pill"); if(!b) return;
    const d = b.dataset;
    if(d.svcall){ state.platformsOpen = !state.platformsOpen; if(!state.platformsOpen) state.platforms = new Set(svc); }
    else if(d.s) state.platforms = toggleIn(state.platforms, svc, d.s);
    else if(d.yall){ state.yearOpen = !state.yearOpen; if(!state.yearOpen) state.yearBuckets = new Set(YEAR_BUCKETS.map(b => b.k)); }
    else if(d.y) state.yearBuckets = toggleIn(state.yearBuckets, YEAR_BUCKETS.map(b => b.k), d.y);
    else if(d.tspdt){ state.tspdtOnly = !state.tspdtOnly; if(!state.tspdtOnly && state.sort === "tspdt") state.sort = "top"; }
    else if(d.watched) state.hideWatched = !state.hideWatched;
    renderAll();
  };
}
function renderStatus(){
  const n = data.films.length;
  document.getElementById("status").textContent =
    `Updated ${fmtDate(data.generated_at)}  ·  ${n.toLocaleString()} films  ·  availability from TMDB / JustWatch`;
}
function renderAll(){ renderControls(); renderView(); renderStatus(); renderIndex(); }

document.getElementById("tabs").onclick = e => {
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  state.view = t.dataset.view;
  renderAll(); scrollTo(0, 0);
};

// Search: the magnifier (or "/") opens it; kept in the URL as ?q= so a search can be shared.
const searchBox = document.getElementById("search"), srch = document.getElementById("srch");
function openSearch(){ srch.classList.add("open"); searchBox.focus(); searchBox.select(); }
document.getElementById("sicon").onclick = openSearch;
searchBox.addEventListener("blur", () => { if(!searchBox.value.trim()) srch.classList.remove("open"); });
function setSearch(q){
  if(searchBox.value !== q) searchBox.value = q;
  if(q.trim()) srch.classList.add("open");
  state.query = q; _qWords = foldText(q).split(" ").filter(Boolean);
  const u = new URL(location.href);
  if(q.trim()) u.searchParams.set("q", q.trim()); else u.searchParams.delete("q");
  history.replaceState(null, "", u);
}
let _searchT = 0;
searchBox.addEventListener("input", () => { clearTimeout(_searchT); _searchT = setTimeout(() => { setSearch(searchBox.value); if(data) renderAll(); }, 150); });
searchBox.addEventListener("keydown", e => {
  if(e.key === "Escape"){ setSearch(""); searchBox.blur(); srch.classList.remove("open"); if(data) renderAll(); }
  if(e.key === "Enter") searchBox.blur();
});
document.addEventListener("keydown", e => {
  if(e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, select, textarea")) return;
  e.preventDefault(); openSearch();
});
setSearch(new URLSearchParams(location.search).get("q") || "");

document.querySelector(".logo").onclick = e => {
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0 || !data) return;
  e.preventDefault();
  Object.assign(state, initialState()); resetFilters(); setSearch("");
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.view === "movie"));
  renderAll(); scrollTo({top:0, behavior:"smooth"});
};

// --- Theme follows the sun in Paris, as on Paris Cinemas: Riso by day, Riso Noir after sunset. ---
function parisIsDaylight(){
  const lat = 48.8566, lng = 2.3522, rad = Math.PI / 180, now = Date.now();
  const J = now / 86400000 + 2440587.5, n = Math.round(J - 2451545.0 + 0.0008), Js = n + lng / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
  const decl = Math.asin(Math.sin(lam * rad) * Math.sin(23.44 * rad));
  const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
  if(cosH <= -1) return true;
  if(cosH >= 1) return false;
  const H = Math.acos(cosH) / rad, toMs = j => (j - 2440587.5) * 86400000;
  return now >= toMs(Jt - H / 360) && now < toMs(Jt + H / 360);
}
function applyAutoSkin(){ document.body.dataset.skin = parisIsDaylight() ? "funk" : "funknight"; }
applyAutoSkin();
setInterval(applyAutoSkin, 300000);

// --- Poster lightbox: click a poster for the large version. ---
const _lb = document.getElementById("lightbox"), _lbImg = _lb.querySelector("img");
viewEl.addEventListener("click", e => {
  const img = e.target.closest("img.poster"); if(!img) return;
  _lbImg.src = img.src.replace(/\/w\d+\//, "/w780/");
  _lb.classList.add("open"); _lb.setAttribute("aria-hidden", "false");
});
function closeLightbox(){ _lb.classList.remove("open"); _lb.setAttribute("aria-hidden", "true"); _lbImg.removeAttribute("src"); }
_lb.addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeLightbox(); });

async function load(){
  try {
    const [d, t, w] = await Promise.all([
      fetch("data.json", {cache:"no-store"}).then(r => r.json()),
      fetch("tspdt.json").then(r => r.json()).catch(() => null),
      fetch("watched.json", {cache:"no-store"}).then(r => r.json()).catch(() => null)]);
    data = d;
    const rated = d.films.filter(f => f.votes >= 50);
    if(rated.length) meanRating = rated.reduce((n, f) => n + f.rating, 0) / rated.length;
    if(t){ t.tmdb.forEach((id, i) => { if(id && !tspdt.has(id)) tspdt.set(id, i + 1); }); tspdtEdition = t.edition || ""; }
    if(w) watched = new Set(Object.values(w.films).filter(Boolean));
  } catch(e) { viewEl.innerHTML = `<div class="note">Could not load data.json.</div>`; return; }
  resetFilters();
  renderAll();
}
load();
