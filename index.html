<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Onest:wght@700&family=Playfair+Display:wght@900&family=Syne:wght@700&display=swap">
<style>
  /* Funk: a 70s video-store wall. Cream and brown by day, chocolate after sunset in Paris. */
  :root { --maxw:1120px; --mono:Inter,system-ui,sans-serif; --pillf:Onest,Inter,system-ui,sans-serif; --display:"Playfair Display",Georgia,serif; --title:Syne,Inter,system-ui,sans-serif; }
  body[data-skin="funk"] {
    --bg:#f6ead2; --card:#fff8ea; --fg:#3b1f12; --muted:#8a6a52; --faint:#c9b597; --line:#3b1f12;
    --kino:#7a1f2b; --o:#e5532d; --y:#f2a93b; --t:#1f8a84; --p:#c23b6b; --accent-text:#c23b6b; --shadow:#e5532d; color-scheme:light;
  }
  body[data-skin="funknight"] {
    --bg:#22130c; --card:#2f1b11; --fg:#f6ead2; --muted:#b39478; --faint:#6b4e3a; --line:#f6ead2;
    --kino:#8a2736; --o:#ff6a3d; --y:#ffb648; --t:#3ec1b8; --p:#ff5c93; --accent-text:#ffb648; --shadow:#ff6a3d; color-scheme:dark;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--mono); }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  a { color:inherit; }

  /* Header: the four stripes live in the title now, so just a hairline underneath. */
  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1.5px solid var(--faint); }
  .bar { --lg:42px; display:flex; align-items:center; gap:20px; padding:14px 0 12px; }
  /* The logo: "cambokino" in Playfair Display Black, flat colour, no outline: burgundy for "cambo",
     mustard for "kino", in both day and night. */
  .logo { display:block; font-family:var(--display); font-weight:900; font-size:var(--lg); line-height:1.1; text-decoration:none; white-space:nowrap;
          padding:0 2px; color:var(--kino); }
  .logo i { font-style:normal; color:var(--y); }
  /* The view icons, the magnifier and the open search box sit level with the logo's lowercase letters (the middle of the
     "o", .148em below the middle of the logo's line box), not with the box, which is higher because of the ascenders. */
  nav, .srch { position:relative; top:calc(var(--lg) * .148); }
  /* Posters and List: a grid and a list icon beside the search, the one showing in orange. */
  nav { margin-left:auto; display:flex; gap:4px; }
  .tab { display:flex; cursor:pointer; color:var(--faint); padding:4px; border:0; background:none; }
  .tab svg { width:20px; height:20px; }
  /* Hover effects only with a mouse: a phone keeps :hover on the last thing tapped. */
  @media (hover:hover) {
    .tab:hover { color:var(--fg); }
  }
  .tab.active { color:var(--o); }
  .srch { display:flex; align-items:center; }
  .sicon { display:flex; cursor:pointer; background:none; border:0; padding:4px; color:var(--fg); }
  .sicon svg { width:18px; height:18px; }
  .srch.open .sicon, .srch:not(.open) .search { display:none; }
  .search { width:180px; font:12.5px/1.5 var(--mono); color:var(--fg); background:var(--card);
            border:2px solid var(--fg); border-radius:999px; padding:6px 14px; }
  .search:focus { outline:none; box-shadow:3px 3px 0 var(--o); }
  /* Safari draws type="search" as its own search field, ignoring the height and padding set here;
     plain styling makes every browser size the box the same way. */
  .search { -webkit-appearance:none; appearance:none; margin:0; }
  .search::-webkit-search-decoration { -webkit-appearance:none; }

  .controls { display:flex; flex-direction:column; gap:10px; padding:22px 0 4px; }
  /* The pills stick under the header while the films scroll beneath them. */
  .ctlbar { position:sticky; top:var(--hdr,0px); z-index:9; background:var(--bg); padding-bottom:12px; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { cursor:pointer; border:2px solid var(--fg); border-radius:999px; padding:5px 13px; font:700 12px var(--pillf);
          background:var(--card); color:var(--fg); transition:transform .1s; }
  @media (hover:hover) {
    .pill:hover { transform:translateY(-1px); box-shadow:2px 2px 0 var(--fg); }
  }
  /* The same lift while a finger is on the pill (set in JS: :active needs a touch listener on iOS). */
  .pill.pressed { transform:translateY(-1px); box-shadow:2px 2px 0 var(--fg); }
  .pill.off { color:var(--muted); border-color:var(--faint); background:transparent; }
  /* Segmented bars: a filter and its choices, or the on/off toggles, joined into one strip, the
     pills inside it divided by thin lines. A press or hover darkens a segment rather than lifting it. */
  .seg { display:inline-flex; border:2px solid var(--fg); border-radius:999px; overflow:hidden; background:var(--card); }
  .seg .pill { border:0; border-radius:0; }
  .seg .pill + .pill { border-left:1.5px solid var(--fg); }
  .seg .pill.pressed { transform:none; box-shadow:inset 0 0 0 99px rgba(0,0,0,.1); }
  @media (hover:hover) {
    .seg .pill:hover { transform:none; box-shadow:inset 0 0 0 99px rgba(0,0,0,.08); }
  }
  .pill.all { font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .pill .x { margin-left:2px; padding:6px 4px 6px 6px; margin-top:-6px; margin-bottom:-6px; font-size:1.2em; line-height:1; opacity:.8; }
  .pill .x:hover { opacity:1; }
  /* Left to right the pills follow the header stripes (ink, orange, yellow, teal), then pink. */
  .pill.all.on { background:var(--o); color:#fff8ea; }
  .pill[data-svcall].on { background:var(--fg); color:var(--bg); }
  .pill[data-yall].on { background:var(--o); color:#fff8ea; }
  .pill[data-tspdt].on { background:var(--y); color:#3b1f12; }
  .pill[data-watched].on { background:var(--t); color:#fff8ea; }
  .pill[data-watchlist].on { background:var(--p); color:#fff8ea; }
  body:has(#mindex.on) .controls { padding-right:var(--idxw,0px); }
  /* The sort: a segmented bar like the filters, "Sort" then the current order with a drawn chevron.
     The <select> itself is kept (bare) so phones still open their own picker. */
  .sels { margin-left:auto; position:relative; }
  .slabel { display:flex; align-items:center; padding:5px 13px; font:700 12px var(--pillf); text-transform:uppercase; letter-spacing:.06em; }
  .sel { appearance:none; -webkit-appearance:none; font:700 12px var(--pillf); color:var(--fg); background:transparent; border:0;
         border-left:1.5px solid var(--fg); padding:5px 32px 5px 13px; cursor:pointer; border-radius:0; }
  .sel:focus-visible { outline:none; box-shadow:inset 0 0 0 99px rgba(0,0,0,.08); }
  .sels::after { content:""; position:absolute; right:14px; top:50%; width:6px; height:6px; margin-top:-5px; pointer-events:none;
                 border:solid var(--fg); border-width:0 2px 2px 0; transform:rotate(45deg); }

  /* The wall: posters as tape boxes on a shelf. */
  main { padding:16px 0 40px; }
  #view { display:grid; grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); gap:30px 22px; align-items:start; }
  #view > .empty, #view > .note, #view > .more { grid-column:1 / -1; }
  .film { display:flex; flex-direction:column; position:relative; }
  .film:nth-child(4n+1) { --shadow:var(--o); } .film:nth-child(4n+2) { --shadow:var(--y); }
  .film:nth-child(4n+3) { --shadow:var(--t); } .film:nth-child(4n) { --shadow:var(--p); }
  .poster { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:12px;
            background:repeating-linear-gradient(45deg, var(--y) 0 10px, var(--o) 10px 20px);
            box-shadow:6px 6px 0 var(--shadow); transition:transform .15s ease, box-shadow .15s ease; }
  @media (hover:hover) {
    .film:hover .poster { transform:rotate(-2deg) translate(-2px,-3px); box-shadow:9px 9px 0 var(--shadow); }
    .film:nth-child(even):hover .poster { transform:rotate(2deg) translate(-2px,-3px); }
  }
  .info { padding:13px 2px 0; min-width:0; }
  .ti { font:700 19px/1.15 var(--title); letter-spacing:-.005em;
        overflow-wrap:break-word; }  /* a safety net under breakable() */
  .ti a { text-decoration:none; }
  @media (hover:hover) {
    .ti a:hover { color:var(--accent-text); }
  }
  .by { color:var(--muted); font-size:11.5px; line-height:1.45; margin-top:3px; }
  .morig { font-style:italic; }
  /* Short credits on a small card: no original title; runtime and genres below, as on Paris Cinemas (not on phones). */
  .by > .ph-hide:has(.morig) { display:none; }
  .mdet { margin-top:1px; }
  /* TSPDT rank: a round price sticker on the box. */
  .tspdt { position:absolute; top:-10px; right:-8px; z-index:2; display:grid; place-items:center; width:44px; height:44px;
           border-radius:50%; background:var(--y); color:#3b1f12; border:2px solid var(--fg); font:700 12px var(--mono);
           transform:rotate(12deg); }
  .newtag { position:absolute; top:10px; left:-6px; z-index:2; background:var(--t); color:#fff8ea; padding:2px 8px;
            font:700 10.5px var(--mono); text-transform:uppercase; letter-spacing:.08em; border:2px solid var(--fg); transform:rotate(-6deg); }
  /* Platforms: little stickers. */
  .where { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .where .sv { cursor:default; user-select:none; -webkit-user-select:none; font:700 11px var(--pillf); padding:2px 8px; border-radius:999px;
             border:1px solid var(--fg); background:var(--card); white-space:nowrap; }
  /* Countries: a lighter grey after the name, folded away until the pill is opened: with a mouse by hovering it, on a
     touch screen by tapping it (a tap elsewhere, or on another pill, closes it; JS toggles .open). The pill grows over
     its neighbours instead of pushing them (its right margin shrinks by the same amount), so nothing around it moves,
     wraps or flickers. Pills with no countries (.x missing) never react. */
  .where .sv { position:relative; transition:margin .2s ease, opacity .2s ease; }
  .where .rg { color:color-mix(in srgb, var(--muted) 60%, var(--card)); display:inline-block; vertical-align:bottom; width:0;
               margin-left:0; opacity:0; overflow:hidden; white-space:nowrap;
               transition:width .2s ease, margin-left .2s ease, opacity .2s ease; }
  .where .sv.x.open { z-index:2; margin-right:calc(-1 * (var(--w, 0px) + 4px)); }
  .where .sv.x[data-flip].open { margin-right:0; margin-left:calc(-1 * (var(--w) + 4px)); }
  .where:has(> .sv.x.open) > .sv[data-under] { opacity:.1; }
  .where .sv.x.open .rg { width:var(--w, 0px); margin-left:4px; opacity:1; }
  /* The same four rules for hover, only where there is a real hover (a phone keeps :hover on the last thing tapped). */
  @media (hover:hover) {
    .where .sv.x:hover { z-index:2; margin-right:calc(-1 * (var(--w, 0px) + 4px)); }
    .where .sv.x[data-flip]:hover { margin-right:0; margin-left:calc(-1 * (var(--w) + 4px)); }
    .where:has(> .sv.x:hover) > .sv[data-under] { opacity:.1; }
    .where .sv.x:hover .rg { width:var(--w, 0px); margin-left:4px; opacity:1; }
  }

  /* The list: one film a line, as on the link preview, credits nudged down to sit level with the stickers. */
  #view.list { grid-template-columns:minmax(0, 1fr); gap:0; }
  .lrow { display:flex; align-items:center; gap:6px 18px; padding:11px 0; border-bottom:2px dashed var(--faint); }
  .lmain { display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; flex:1; min-width:0; }
  .lrow .ti { font-size:22px; }
  .lrow .by { margin-top:0; position:relative; top:2px; }
  .lrow .where { margin:0 0 0 auto; justify-content:flex-end; flex:none; max-width:45%; }
  .lrow .tspdt, .lrow .newtag { position:static; display:inline-block; width:auto; height:auto; margin-left:8px; vertical-align:3px; transform:rotate(-4deg); }
  .lrow .tspdt { padding:1px 7px; border-radius:999px; font-size:10.5px; }
  .empty, .note { color:var(--muted); font-size:13px; padding:20px 0; }
  .note { padding:64px 0; text-align:center; }
  .more { height:1px; }

  footer { margin-top:12px; }
  footer::before { content:""; display:block; height:10px;
    background:linear-gradient(var(--t) 0 33%, var(--y) 33% 66%, var(--o) 66%); }

  #lightbox { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(34,19,12,.85); padding:24px; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:92vw; max-height:88vh; border-radius:14px; border:4px solid #f6ead2; box-shadow:10px 10px 0 #e5532d; }

  /* Centred between the bottom of the header and the bottom of the screen. */
  #mindex { position:fixed; right:2px; top:calc(50% + var(--hdr,0px) / 2); transform:translateY(-50%); z-index:20; display:none; flex-direction:column;
            align-items:center; padding:8px 3px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer;
            background:var(--card); border:2px solid var(--fg); border-radius:999px; }
  #mindex.on { display:flex; }
  @media (pointer:fine) { #mindex { right:12px; } }
  #mindex span { display:block; padding:0 4px; font:700 var(--ifs,10.5px)/1.65 var(--mono); color:var(--o); }
  #mindex span.no { color:var(--faint); }
  #mindex.dec span { line-height:2.3; }
  .film, .lrow { scroll-margin-top:calc(var(--hdr,80px) + var(--ctl,0px)); }
  .wrap.has-idx { padding-right:max(24px, calc(var(--idxw,0px) - max(0px, (100vw - var(--maxw)) / 2))); }

  @media (max-width:560px) {
    /* Swipeable pill rows, running to the screen edges; the padding leaves room for the pressed lift. */
    .pills.swipe { flex-wrap:nowrap; overflow-x:auto; margin:-2px -24px -4px; padding:2px 24px 4px;
                   scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .pills.swipe::-webkit-scrollbar { display:none; }
    .pills.swipe > * { flex:none; }
    .bar { flex-wrap:wrap; gap:10px; }
    .bar { --lg:34px; }
    /* An open search fills what's left of the logo's row, the view icons stepping aside to make room
       (the logo keeps its size); 13px text, which makes iOS Safari zoom in when the box is focused (16px would not). */
    .bar:has(.srch.open) nav { display:none; }
    /* The open box is 23.5px tall, the text centred inside, and centred on the middle of the logo's lowercase "o". It's placed
       from the baseline, which every browser agrees on. With the typed text's baseline on the logo's, the box's middle is
       measured (Playfair Display Black at 34px, Inter text at 13px) to sit 2.1px below the o's middle, so the box moves up
       4.35px: 2.25px for the original offset plus those 2.1px. */
    .bar:has(.srch.open) { align-items:baseline; }
    .srch.open { flex:1 1 0; min-width:0; position:relative; top:-4.35px; }
    .srch.open .search { width:100%; height:23.5px; font-size:13px; line-height:1; padding:0 12px; }
    #view { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:26px 18px; }
    .by .ph-hide, .mdet { display:none; }
    /* Netflix with all six countries is wider than a two-column card in this bold face: a touch smaller on phones. */
    .where .sv { font-size:10.25px; padding:2px 7px; }
    .lrow { flex-wrap:wrap; }
    .lrow .ti { font-size:19px; }
    .lmain { flex-basis:100%; }
    .lrow .where { margin-left:0; max-width:none; justify-content:flex-start; }
  }
</style>
</head>
<body data-skin="funk">
<header><div class="wrap">
  <div class="bar">
    <a class="logo" href="./" aria-label="Cambokino Movies">cambo<i>kino</i></a>
    <nav id="tabs">
      <button class="tab active" data-view="posters" aria-label="Posters" title="Posters"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"/></svg></button>
      <button class="tab" data-view="list" aria-label="List" title="List"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3.5h14M3 10h14M3 16.5h14"/></svg></button>
    </nav>
    <div class="srch" id="srch">
      <button class="sicon" id="sicon" type="button" aria-label="Search" title="Search (/)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="6.75" cy="6.75" r="4.75"/><path d="M10.25 10.25 14.5 14.5"/></svg></button>
      <input id="search" class="search" type="search" placeholder="search" aria-label="Search films, directors, countries, genres"
        autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
  </div>
</div></header>

<div class="ctlbar"><div class="wrap"><div class="controls" id="controls"></div></div></div>
<main><div class="wrap" id="view"><div class="note">Loading…</div></div></main>
<footer></footer>
<div id="lightbox" aria-hidden="true"><img alt=""></div>
<div id="mindex" role="navigation" aria-label="Jump to"></div>

<script>
const NOW_YEAR = new Date().getFullYear();
const YEAR_BUCKETS = [
  { k:"new",    label:"New releases", test:y => y >= NOW_YEAR - 1 },
  { k:"recent", label:"21st century", test:y => y >= 2000 && y <= NOW_YEAR - 2 },
  { k:"old",    label:"20th century", test:y => y < 2000 },
];
const SORT_OPTS = [["top","Top rated"], ["tspdt","TSPDT rank"], ["added","Newly added"], ["title","A–Z"], ["old","Oldest first"], ["new","Newest first"]];
const CHUNK = 250;  // rows added per scroll step: the full list runs to thousands

let data = null, tspdt = new Map(), tspdtEdition = "", watched = new Set(), watchlist = new Set();
const initialState = () => ({ view:"posters", platforms:new Set(), regions:new Set(), platformsOpen:false,
  yearBuckets:new Set(YEAR_BUCKETS.map(b => b.k)), yearOpen:false, tspdtOnly:false, hideWatched:false, watchlistOnly:false, sort:"top", query:"" });
const state = initialState();
const allPlatforms = () => data.platforms.map(s => s.name);
// Platforms left off until picked: the Platforms pill counts as "all" without them, and closing it returns here.
const OFF_BY_DEFAULT = ["Disney"];
const defaultPlatforms = () => allPlatforms().filter(s => !OFF_BY_DEFAULT.includes(s));
const allRegions = () => [...new Set(data.platforms.flatMap(s => s.regions))];
// A platform we only check in one country (Criterion, Kanopy…) needs no country label.
const oneRegion = s => data.platforms.find(p => p.name === s)?.regions.length === 1;
function resetFilters(){ state.platforms = new Set(defaultPlatforms()); state.regions = new Set(allRegions()); }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const foldTitle = s => (s || "").normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
const foldText = s => String(s == null ? "" : s).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();

// Where a film streams, narrowed to the selected platforms and countries.
function whereOf(f){
  const out = [];
  for(const [s, rs] of Object.entries(f.where)){
    if(!state.platforms.has(s)) continue;
    const r = rs.filter(x => state.regions.has(x));
    if(r.length) out.push([s, r]);
  }
  return out;
}
function yearIn(y){
  if(state.yearBuckets.size === YEAR_BUCKETS.length) return true;
  const n = parseInt(y, 10);
  return isNaN(n) || YEAR_BUCKETS.some(b => state.yearBuckets.has(b.k) && b.test(n));
}
const rank = f => tspdt.get(f.id);
// Top rated: the TMDB rating pulled toward the catalog average as if by 500 more votes, so a film
// needs both a good rating and many raters to rise (Tokyo Story above Deadpool, obscure 10/10s sink).
let meanRating = 6.5;
const score = f => (f.votes * f.rating + 500 * meanRating) / (f.votes + 500);

// Search: every word must match title, original title, director, year,
// country, genres or a platform. A four-digit word is an exact year; "60s" or
// "1960s" a decade.
let _qWords = [];
const _hay = new WeakMap();
function haystack(f){
  let h = _hay.get(f);
  if(h === undefined){
    const y = parseInt(f.year, 10);
    h = " " + foldText([f.title, f.orig, f.director, f.country, f.genres, Object.keys(f.where).join(" "),
      isNaN(y) ? "" : `${Math.floor(y/10)*10}s ${String(Math.floor(y/10)*10).slice(2)}s`].join(" ")) + " ";
    _hay.set(f, h);
  }
  return h;
}
function inSearch(f){
  if(!_qWords.length) return true;
  const h = haystack(f);

let _movieIndex = [];
function filmsView(){
  const yr = f => parseInt(f.year, 10);

  const list = visible();
  if(state.sort === "top") list.sort((a, b) => score(b) - score(a) || byTitle(a, b));
  else if(state.sort === "title") list.sort(byTitle);

  else if(state.sort === "added") list.sort((a, b) => (b.added || "").localeCompare(a.added || "") || score(b) - score(a) || byTitle(a, b));

    if(state.sort === "title"){ const ch = foldTitle(f.title).charAt(0).toUpperCase(); return /[A-Z]/.test(ch) ? ch : "#"; }
    if(state.sort === "tspdt") return rank(f) ? String(Math.floor(rank(f) / 100) * 100 || 1) : "?";
    if(state.sort === "top" || state.sort === "added") return "";

function renderIndex(){

  ix.innerHTML = _movieIndex.map(x => `<span data-k="${esc(x.k)}"${x.has ? "" : ` class="no"`}>${esc(x.k)}</span>`).join("");

(() => {
  const ix = document.getElementById("mindex");
  let active = false, last = null;
  const jump = y => {
    const spans = [...ix.querySelectorAll("span")];
    if(!spans.length) return;
    let i = spans.findIndex(sp => y < sp.getBoundingClientRect().bottom);
    if(i < 0) i = spans.length - 1;
    let j = i;
    while(j < _movieIndex.length && !_movieIndex[j].has) j++;
    if(j >= _movieIndex.length){ j = i; while(j >= 0 && !_movieIndex[j].has) j--; }
    if(j < 0 || _movieIndex[j].k === last) return;
    last = _movieIndex[j].k;

    const at = _rows.findIndex(([, ig]) => ig === last);

  };

  // (data-flip), else whichever side has more. The pills it would cover are marked (data-under) so CSS can fade them.
  const measurePill = a => {
    const g = a.querySelector(".rg");

})();

// --- Theme follows the sun in Paris, as on Paris Cinemas: Riso by day, Riso Noir after sunset. ---
function parisIsDaylight(){
  const lat = 48.8566, lng = 2.3522, rad = Math.PI / 180, now = Date.now();
  const J = now / 86400000 + 2440587.5, n = Math.round(J - 2451545.0 + 0.0008), Js = n + lng / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
  const decl = Math.asin(Math.sin(lam * rad) * Math.sin(23.44 * rad));
  const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
  if(cosH <= -1) return true;
  if(cosH >= 1) return false;
  const H = Math.acos(cosH) / rad, toMs = j => (j - 2440587.5) * 86400000;
  return now >= toMs(Jt - H / 360) && now < toMs(Jt + H / 360);
}

    const rated = d.films.filter(f => f.votes >= 50);
    if(rated.length) meanRating = rated.reduce((n, f) => n + f.rating, 0) / rated.length;
    if(t){ t.tmdb.forEach((id, i) => { if(id && !tspdt.has(id)) tspdt.set(id, i + 1); }); tspdtEdition = t.edition || ""; }
    if(w) watched = new Set(Object.values(w.films).filter(Boolean));
    if(wl) watchlist = new Set(Object.values(wl.films).filter(Boolean));
  } catch(e) { viewEl.innerHTML = `<div class="note">Could not load data.json.</div>`; return; }
  resetFilters();
  renderAll();
}
load();
</script>
