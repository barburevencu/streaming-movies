# Fetches what's streaming every Monday morning, commits the refreshed data,
# and publishes the site to GitHub Pages.
name: Refresh and publish

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch streaming catalogs
        if: github.event_name != 'push'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 fetch.py

      # New diary entries from Letterboxd, for the Watched pill. Not worth
      # failing the refresh over if Letterboxd is down or turns us away.
      - name: Fetch watched films
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 import_watched.py --rss

      # The Letterboxd watchlist, for the Watchlist pill; same leniency.
      - name: Fetch watchlist
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 import_watched.py --watchlist

      # cache.json (film details) and state.json (first/last seen) carry over
      # between runs, so they're committed along with the site's data.
      # watched.json and watchlist.json are listed only when present, so git add doesn't fail without them.
      # Anything pushed to main during the run (code, or another run's data) is pulled in first; where
      # both touched the same data file, this run's fresher fetch wins.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json cache.json state.json $(ls watched.json watchlist.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Update catalogs $(date +%F)"
          git pull --rebase -X theirs
          git push

      - name: Prepare site
        run: |
          mkdir _site && cp index.html data.json tspdt.json favicon.svg og.png apple-touch-icon.png _site/
          for f in watched.json watchlist.json; do if [ -f $f ]; then cp $f _site/; fi; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
